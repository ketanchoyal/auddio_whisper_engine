name: auddio_whisper_engine
description: >-
  Custom whisper.cpp FFI engine for Auddio chapter transcription with
  per-word (DTW) timestamps. Loads a prebuilt libauddio_whisper native
  library (Metal + CoreML on Apple, CPU/NEON on Android) via dart:ffi.
version: 0.0.17
publish_to: none

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0
  meta: ^1.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # ffiPlugin with no pluginClass is intentional: native lib is loaded via
  # DynamicLibrary.open, not a MethodChannel.
  plugin:
    platforms:
      ios:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      android:
        ffiPlugin: true
